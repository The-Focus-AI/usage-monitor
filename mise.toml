[tools]
node = "latest"
"npm:@mariozechner/pi-coding-agent" = "latest"
"npm:neonctl" = "latest"
pnpm = "10.12.3"

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
postinstall = 'npx corepack enable'

[settings]
# This must be enabled to make the hooks work
experimental = true

[env]
_.path = ['./node_modules/.bin']
_.file = ['.env']

[tasks.pnpm-install]
description = 'Installs dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.dev]
description = 'Start API server and dashboard dev server with auto-reload'
run = '''
set -e
pnpm server:dev &
server_pid=$!
pnpm dashboard:dev &
dashboard_pid=$!
trap 'kill $server_pid $dashboard_pid 2>/dev/null' INT TERM EXIT
wait
'''
depends = ['pnpm-install']

[tasks.server-dev]
description = 'Start the usage monitor API server with auto-reload (port 3000)'
run = 'pnpm server:dev'
depends = ['pnpm-install']

[tasks.dashboard-dev]
description = 'Start the dashboard Vite dev server (port 5173, proxies /api to port 3000)'
run = 'pnpm dashboard:dev'
depends = ['pnpm-install']

[tasks.check-balance]
description = 'Check OpenRouter balance and post to Slack'
run = 'node scripts/check-balance.mjs'
depends = ['pnpm-install']

[tasks.check-balance-dry]
description = 'Check OpenRouter balance without posting to Slack (dry run)'
run = 'SLACK_WEBHOOK_URL="" node scripts/check-balance.mjs'
depends = ['pnpm-install']

[tasks.server]
description = 'Start the usage monitor API server (port 3000)'
run = 'tsx src/server/main.ts'
depends = ['pnpm-install']

[tasks.test]
description = 'Run the full Vitest suite serially'
run = 'pnpm test:run'
depends = ['pnpm-install']
